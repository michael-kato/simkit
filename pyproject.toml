[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simkit"
version = "0.1.0"
description = "Engine-agnostic synthetic data tooling for robotics: one scenario spec, any simulator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "OpenEXR>=3.3",
    "pydantic>=2",
    "pyyaml>=6",
    "pillow>=10",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
simkit = "simkit.cli:main"

[tool.setuptools]
package-dir = { simkit = "source" }
packages = ["simkit", "simkit.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
