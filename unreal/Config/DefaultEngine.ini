[/Script/Engine.RendererSettings]
; Every capture is a single frame with no history, so turn off what needs
; several frames to converge (temporal AA, screen-space reflections and AO)
; and the lens effects the other engines don't render. Lumen GI and virtual
; shadow maps are pinned off too, as the engine defaults are today.
r.AntiAliasingMethod=0
r.ReflectionMethod=0
r.DynamicGlobalIlluminationMethod=0
r.Shadow.Virtual.Enable=0
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False

; Captures must show full-resolution textures, so load them up front instead of streaming.
[SystemSettings]
r.TextureStreaming=0

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Runs Content/Python/simkit_server.py at editor start-up; it serves only when launched with -simkitport.
; (-ExecutePythonScript would quit the editor as soon as the script returns.)
+StartupScripts=import simkit_server
