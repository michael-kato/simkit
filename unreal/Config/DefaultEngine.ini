; Captures must show full-resolution textures, so load them up front instead of streaming.
[SystemSettings]
r.TextureStreaming=0

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Runs Content/Python/simkit_server.py at editor start-up; it serves only when launched with -simkitport.
; (-ExecutePythonScript would quit the editor as soon as the script returns.)
+StartupScripts=import simkit_server
